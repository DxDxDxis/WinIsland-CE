<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">WinIsland 1.3.4 社区版项目概览</title>
  <desc id="desc">黑色灵动岛、音乐通知、插件和文件中转功能的项目概览图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#07111f"/>
    </linearGradient>
    <linearGradient id="island" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="1" stop-color="#1a1a1a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="18"/><feComponentTransfer><feFuncA type="linear" slope=".45"/></feComponentTransfer><feOffset dy="16"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1350" cy="120" r="220" fill="#2563eb" opacity=".12"/>
  <circle cx="180" cy="790" r="260" fill="#06b6d4" opacity=".08"/>
  <text x="120" y="150" fill="#f8fafc" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="64" font-weight="700">WinIsland</text>
  <text x="124" y="205" fill="#93c5fd" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="30">1.3.4 社区版 · Windows 桌面灵动岛</text>
  <text x="124" y="270" fill="#cbd5e1" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="24">将音乐、消息、插件与文件中转集中到一个轻量的桌面交互区域。</text>
  <rect x="508" y="334" width="584" height="178" rx="88" fill="#000" opacity=".5" filter="url(#shadow)"/>
  <rect x="500" y="320" width="584" height="178" rx="89" fill="url(#island)" stroke="#3f3f46" stroke-width="3"/>
  <circle cx="570" cy="409" r="27" fill="#38bdf8"/><path d="M562 409h16M570 401v16" stroke="#082f49" stroke-width="6" stroke-linecap="round"/>
  <text x="622" y="393" fill="#f8fafc" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="30" font-weight="600">WinIsland</text>
  <text x="622" y="438" fill="#94a3b8" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="22">音乐 · 消息 · 插件 · 文件中转</text>
  <g font-family="Segoe UI,Microsoft YaHei,sans-serif">
    <rect x="120" y="575" width="300" height="170" rx="24" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <text x="154" y="630" fill="#7dd3fc" font-size="28" font-weight="600">信息聚合</text>
    <text x="154" y="677" fill="#cbd5e1" font-size="22">音乐、歌词与通知</text><text x="154" y="714" fill="#94a3b8" font-size="20">独立显示开关 · 平滑动画</text>
    <rect x="462" y="575" width="300" height="170" rx="24" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <text x="496" y="630" fill="#86efac" font-size="28" font-weight="600">插件扩展</text>
    <text x="496" y="677" fill="#cbd5e1" font-size="22">SDK、模组设置与场景</text><text x="496" y="714" fill="#94a3b8" font-size="20">稳定 ID · 状态持久化</text>
    <rect x="804" y="575" width="300" height="170" rx="24" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <text x="838" y="630" fill="#fcd34d" font-size="28" font-weight="600">文件中转</text>
    <text x="838" y="677" fill="#cbd5e1" font-size="22">引用或保存副本</text><text x="838" y="714" fill="#94a3b8" font-size="20">拖入拖出 · 停靠与浮动</text>
    <rect x="1146" y="575" width="334" height="170" rx="24" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <text x="1180" y="630" fill="#c4b5fd" font-size="28" font-weight="600">开放开发</text>
    <text x="1180" y="677" fill="#cbd5e1" font-size="22">C++ 核心与 WinUI 设置</text><text x="1180" y="714" fill="#94a3b8" font-size="20">BSD-3-Clause · 可回溯归档</text>
  </g>
  <text x="120" y="832" fill="#64748b" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="19">项目概览图 · 归档版本 1.3.4 · 真实功能以对应版本说明和验证报告为准</text>
</svg>
